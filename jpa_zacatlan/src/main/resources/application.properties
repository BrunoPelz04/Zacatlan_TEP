spring.application.name=jpa_zacatlan
#Conexion a BD (cambia usuario y contraseña)
spring.datasource.url=jdbc:mariadb://localhost:3306/zacatlan_ventas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=brunopelz
spring.datasource.password=1234
#Recrea las tablas en cada arranque
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
