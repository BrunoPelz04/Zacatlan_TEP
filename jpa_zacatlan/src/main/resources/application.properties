spring.application.name=jpa_zacatlan

# Conexion a MariaDB 11.8
spring.datasource.url=jdbc:mariadb://localhost:3308/zacatlan_ventas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234

# Recrea las tablas en cada arranque
spring.jpa.hibernate.ddl-auto=create

# Mostrar consultas SQL
spring.jpa.show-sql=true

# Carga los datos de ejemplo de data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Dialecto de MariaDB
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Codificacion
spring.sql.init.encoding=UTF-8