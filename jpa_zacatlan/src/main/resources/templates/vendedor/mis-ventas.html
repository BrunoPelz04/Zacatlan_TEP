<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Mis ventas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container zac-main">
    <h1>Mis ventas</h1>
    <p class="lead text-body-secondary mb-4" th:text="${session.sesion.bloque}">Bloque</p>
    <div th:replace="~{fragments/layout :: avisos}"></div>

    <form class="card card-body mb-4" method="get" th:action="@{/vendedor/ventas}">
        <div class="row g-3 align-items-end">
            <div class="col-6 col-md-3">
                <label class="form-label" for="desde">Desde</label>
                <input class="form-control" id="desde" name="desde" type="date" th:value="${desde}">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="hasta">Hasta</label>
                <input class="form-control" id="hasta" name="hasta" type="date" th:value="${hasta}">
            </div>
            <div class="col-auto d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-primary">Ver ventas</button>
                <a class="btn btn-outline-primary"
                   th:href="@{/vendedor/ventas/pdf(desde=${desde},hasta=${hasta})}">Descargar reporte PDF</a>
            </div>
        </div>
    </form>

    <section class="card card-body">
        <p th:if="${#lists.isEmpty(ventas)}" class="mb-0">No hay ventas registradas en este día.</p>
        <div th:unless="${#lists.isEmpty(ventas)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th th:text="${varios} ? 'Fecha y hora' : 'Hora'">Hora</th><th>Producto</th><th>Cant.</th><th>Precio</th><th class="text-end">Total</th></tr></thead>
                <tbody>
                <tr th:each="v : ${ventas}">
                    <td th:text="${varios} ? ${v.fechaHoraTexto} : ${v.hora}">10:15</td>
                    <td th:text="${v.productoNombre}">Producto</td>
                    <td th:text="${v.cantidadTexto}">1</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(v.precioUnitario, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                    <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(v.total, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                </tr>
                </tbody>
                <tfoot class="table-group-divider fw-bold"><tr><td colspan="4" th:text="${varios} ? 'Total del periodo' : 'Total del día'">Total del día</td>
                    <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(totalDia, 1, 'COMMA', 2, 'POINT')}">$0.00</td></tr></tfoot>
            </table>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
