<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Administrador')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container zac-main">
    <h1 class="mb-4" th:text="${administrador.id == null} ? 'Nuevo administrador' : 'Editar administrador'">Administrador</h1>
    <div th:replace="~{fragments/layout :: avisos}"></div>
    <form class="card card-body zac-form" method="post" th:action="@{/admin/administradores}">
        <input type="hidden" name="id" th:value="${administrador.id}">
        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" id="nombre" name="nombre" type="text" maxlength="100" required th:value="${administrador.nombre}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Correo</label>
            <input class="form-control" id="email" name="email" type="email" maxlength="120" required autocomplete="off" th:value="${administrador.email}">
        </div>
        <div class="mb-3" th:unless="${administrador.root}">
            <label class="form-label" for="bloqueId">Alcance</label>
            <select class="form-select" id="bloqueId" name="bloqueId">
                <option value="" th:selected="${administrador.bloqueId == null}">Todos los bloques (administrador general)</option>
                <option th:each="b : ${bloques}" th:value="${b.id}" th:text="${b.nombre}"
                        th:selected="${administrador.bloqueId != null and administrador.bloqueId == b.id}">Bloque</option>
            </select>
            <p class="form-text mt-2 mb-0">Si eliges un bloque, solo verá y gestionará las ventas y vendedores de ese bloque.</p>
        </div>
        <p class="form-text mb-3" th:if="${administrador.root}">Administrador root: ve todos los bloques y no se puede eliminar.</p>
        <div class="mb-4">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" minlength="6"
                   autocomplete="new-password" th:required="${administrador.id == null}">
            <p class="form-text mt-2 mb-0" th:if="${administrador.id != null}">Déjala vacía para conservar la actual.</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a class="btn btn-outline-primary" th:href="@{/admin/administradores}">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
