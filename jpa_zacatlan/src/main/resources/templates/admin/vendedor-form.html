<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Vendedor')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container zac-main">
    <h1 class="mb-4" th:text="${vendedor.id == null} ? 'Nuevo vendedor' : 'Editar vendedor'">Vendedor</h1>
    <div th:replace="~{fragments/layout :: avisos}"></div>
    <form class="card card-body zac-form" method="post" th:action="@{/admin/vendedores}">
        <input type="hidden" name="id" th:value="${vendedor.id}">
        <div class="mb-3">
            <label class="form-label" for="nombres">Nombre(s)</label>
            <input class="form-control" id="nombres" name="nombres" type="text" maxlength="50" required th:value="${vendedor.nombres}">
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label" for="apelliPa">Apellido paterno</label>
                <input class="form-control" id="apelliPa" name="apelliPa" type="text" maxlength="50" required th:value="${vendedor.apelliPa}">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="apelliMa">Apellido materno</label>
                <input class="form-control" id="apelliMa" name="apelliMa" type="text" maxlength="50" th:value="${vendedor.apelliMa}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Correo</label>
            <input class="form-control" id="email" name="email" type="email" maxlength="120" required autocomplete="off" th:value="${vendedor.email}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="telefono">Teléfono</label>
            <input class="form-control" id="telefono" name="telefono" type="tel" maxlength="15" th:value="${vendedor.telefono}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="bloqueId">Bloque</label>
            <select class="form-select" id="bloqueId" name="bloqueId" required>
                <option value="" th:selected="${vendedor.bloqueId == null}">Elige un bloque</option>
                <option th:each="b : ${bloques}" th:value="${b.id}" th:text="${b.nombre}"
                        th:selected="${vendedor.bloqueId != null and vendedor.bloqueId == b.id}">Bloque</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" minlength="6"
                   autocomplete="new-password" th:required="${vendedor.id == null}">
            <p class="form-text mt-2 mb-0" th:if="${vendedor.id != null}">Déjala vacía para conservar la actual.</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a class="btn btn-outline-primary" th:href="@{/admin/vendedores}">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
