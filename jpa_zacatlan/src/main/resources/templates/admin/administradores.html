<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Administradores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container zac-main">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h1 class="m-0">Administradores</h1>
        <a class="btn btn-primary" th:href="@{/admin/administradores/nuevo}">Nuevo administrador</a>
    </div>
    <div th:replace="~{fragments/layout :: avisos}"></div>
    <section class="card card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Nombre</th><th>Correo</th><th>Tipo</th><th></th></tr></thead>
                <tbody>
                <tr th:each="a : ${administradores}">
                    <td th:text="${a.nombre}">Administrador</td>
                    <td th:text="${a.email}">correo</td>
                    <td><span class="badge rounded-pill" th:classappend="${a.root} ? 'text-bg-primary' : 'text-bg-light border'" th:text="${a.tipoTexto}">General</span></td>
                    <td><div class="d-flex flex-wrap justify-content-end gap-2">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/administradores/{id}/editar(id=${a.id})}">Editar</a>
                        <form th:unless="${a.root}" method="post" th:action="@{/admin/administradores/{id}/eliminar(id=${a.id})}"><button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button></form>
                    </div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
