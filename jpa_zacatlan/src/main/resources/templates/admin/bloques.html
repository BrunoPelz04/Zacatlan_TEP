<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Bloques')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container zac-main">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h1 class="m-0">Bloques</h1>
        <a class="btn btn-primary" th:href="@{/admin/bloques/nuevo}">Nuevo bloque</a>
    </div>
    <div th:replace="~{fragments/layout :: avisos}"></div>
    <section class="card card-body">
        <p th:if="${#lists.isEmpty(bloques)}" class="mb-0">Todavía no hay bloques. Crea el primero con «Nuevo bloque».</p>
        <div th:unless="${#lists.isEmpty(bloques)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Nombre</th><th>Tipo</th><th>Creado</th><th></th></tr></thead>
                <tbody>
                <tr th:each="b : ${bloques}">
                    <td th:text="${b.nombre}">Bloque</td>
                    <td th:text="${b.tipoTexto}">Tipo</td>
                    <td th:text="${b.fechaTexto}">01/01/2026</td>
                    <td><div class="d-flex flex-wrap justify-content-end gap-2">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/bloques/{id}/editar(id=${b.id})}">Editar</a>
                        <form method="post" th:action="@{/admin/bloques/{id}/eliminar(id=${b.id})}"><button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button></form>
                    </div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
