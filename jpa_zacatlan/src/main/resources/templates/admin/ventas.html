<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Ventas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container zac-main">
    <h1 class="mb-4">Ventas</h1>
    <div th:replace="~{fragments/layout :: avisos}"></div>

    <form class="card card-body mb-4" method="get" th:action="@{/admin/ventas}">
        <div class="row g-3 align-items-end">
            <div class="col-6 col-md-3">
                <label class="form-label" for="desde">Desde</label>
                <input class="form-control" id="desde" name="desde" type="date" th:value="${desde}">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="hasta">Hasta</label>
                <input class="form-control" id="hasta" name="hasta" type="date" th:value="${hasta}">
            </div>
            <div class="col-auto"><button type="submit" class="btn btn-primary">Ver ventas</button></div>
        </div>
    </form>

    <section class="card card-body">
        <p th:if="${#lists.isEmpty(reporte.filas)}" class="mb-0">No hay ventas en este periodo.</p>
        <div th:unless="${#lists.isEmpty(reporte.filas)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>N.º</th><th>Fecha y hora</th><th>Vendedor</th><th>Producto</th><th>Cant.</th><th>Precio</th><th class="text-end">Total</th><th></th></tr></thead>
                <tbody>
                <tr th:each="v : ${reporte.filas}">
                    <td th:text="${v.id}">1</td>
                    <td th:text="${v.fechaHoraTexto}">01/01/2026 10:00</td>
                    <td th:text="${v.vendedorNombre}">Vendedor</td>
                    <td th:text="${v.productoNombre}">Producto</td>
                    <td th:text="${v.cantidadTexto}">1</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(v.precioUnitario, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                    <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(v.total, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                    <td class="text-end"><a class="fw-semibold" th:href="@{/admin/ventas/{id}/editar(id=${v.id})}">Editar</a></td>
                </tr>
                </tbody>
                <tfoot class="table-group-divider fw-bold"><tr>
                    <td colspan="6" th:text="${reporte.totalVentas} + (${reporte.totalVentas == 1} ? ' venta' : ' ventas')">0 ventas</td>
                    <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(reporte.totalMonto, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                    <td></td>
                </tr></tfoot>
            </table>
        </div>
        <p class="form-text mt-3 mb-0">Las ventas no se pueden eliminar, solo editar. Cada cambio queda en el historial.</p>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
