<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Resumen del día')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container zac-main">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <h1 class="mb-1">Resumen del día</h1>
            <p class="lead text-body-secondary m-0" th:text="${fechaTexto}">7 de noviembre de 2026</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/reportes}">Ver reporte del día</a>
    </div>
    <div th:replace="~{fragments/layout :: avisos}"></div>

    <section class="card card-body mb-4">
        <p class="form-text mb-1" th:text="'Vendido hoy en ' + ${resumen.totalVentas} + (${resumen.totalVentas == 1} ? ' venta' : ' ventas')">Vendido hoy</p>
        <strong class="zac-big" th:text="'$' + ${#numbers.formatDecimal(resumen.totalMonto, 1, 'COMMA', 2, 'POINT')}">$0.00</strong>
    </section>

    <div class="row g-4 align-items-start">
        <div class="col-lg-6">
            <section class="card card-body">
                <h2>Ventas por bloque</h2>
                <div class="mb-3" th:each="b : ${resumen.porBloque}">
                    <div class="d-flex justify-content-between">
                        <span th:text="${b.nombre}">Bloque</span>
                        <strong th:text="'$' + ${#numbers.formatDecimal(b.monto, 1, 'COMMA', 2, 'POINT')}">$0.00</strong>
                    </div>
                    <div class="progress mt-1" role="progressbar" th:attr="aria-valuenow=${b.porcentaje}" aria-valuemin="0" aria-valuemax="100" aria-label="Porcentaje del total">
                        <div class="progress-bar" th:style="'width:' + ${b.porcentaje} + '%'"></div>
                    </div>
                </div>
            </section>
        </div>
        <div class="col-lg-6">
            <section class="card card-body">
                <h2>Historial reciente</h2>
                <p th:if="${#lists.isEmpty(resumen.historial)}" class="mb-0">Todavía no hay acciones registradas.</p>
                <div class="border-top py-3" th:each="a : ${resumen.historial}">
                    <p class="mb-1" th:text="${a.descripcion}">Descripción</p>
                    <p class="form-text mb-0" th:text="${a.autor} + ', ' + ${a.cuando}">Autor</p>
                </div>
                <a class="fw-semibold d-inline-block mt-2" th:href="@{/admin/historial}">Ver todo el historial</a>
            </section>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: pie}"></th:block>
</body>
</html>
