<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' – Gobierno del Estado de Zacatlán'">Gobierno del Estado de Zacatlán</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/zacatlan.css}">
</head>
<body>

<nav th:fragment="navbar" th:if="${session.sesion != null}" class="navbar navbar-expand zac-nav" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Gobierno del Estado de Zacatlán</a>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <th:block th:if="${session.sesion.rol == 'ADMIN'}">
                    <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:href="@{/admin}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'ventas'} ? 'active'" th:href="@{/admin/ventas}">Ventas</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'reportes'} ? 'active'" th:href="@{/admin/reportes}">Reportes</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'historial'} ? 'active'" th:href="@{/admin/historial}">Historial</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" aria-haspopup="true"
                           th:classappend="${activo == 'bloques' or activo == 'vendedores' or activo == 'productos' or activo == 'administradores'} ? 'active'">Catálogos</a>
                        <ul class="dropdown-menu">
                            <li th:unless="${session.sesion.adminDeBloque}"><a class="dropdown-item" th:href="@{/admin/bloques}">Bloques</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/vendedores}">Vendedores</a></li>
                            <li><a class="dropdown-item" th:href="@{/admin/productos}">Productos</a></li>
                            <li th:unless="${session.sesion.adminDeBloque}"><a class="dropdown-item" th:href="@{/admin/administradores}">Administradores</a></li>
                        </ul>
                    </li>
                </th:block>
                <th:block th:if="${session.sesion.rol == 'VENDEDOR'}">
                    <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'nueva'} ? 'active'" th:href="@{/vendedor/ventas/nueva}">Nueva venta</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'mias'} ? 'active'" th:href="@{/vendedor/ventas}">Mis ventas</a></li>
                </th:block>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-3">
                <span class="text-white" th:text="${session.sesion.nombre}">Nombre</span>
                <button type="submit" class="btn btn-sm btn-outline-light">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="avisos">
    <div th:if="${exito}" class="alert alert-success" role="status">
        <span th:text="${exito}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>
    <div th:if="${info}" class="alert alert-info" role="status">
        <span th:text="${info}"></span>
    </div>
</div>

<th:block th:fragment="pie">
    <footer class="py-3 text-body-secondary small">
        <div class="container">Gobierno del Estado de Zacatlán</div>
    </footer>
</th:block>

</body>
</html>
